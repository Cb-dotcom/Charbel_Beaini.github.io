    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#20161a"/><stop offset="1" stop-color="#0b0b0c"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- switches + lamps -->
  <g transform="translate(470 70)">
    <g><circle cx="0" cy="40" r="34" fill="#ff453a" filter="url(#g)" opacity=".55"/><circle cx="0" cy="40" r="26" fill="#ff453a"/><rect x="-16" y="100" width="32" height="56" rx="8" fill="#2c2c2e" stroke="#ff453a" stroke-width="3"/><rect x="-9" y="108" width="18" height="22" rx="4" fill="#f5f5f7"/></g>
    <g transform="translate(220 0)"><circle cx="0" cy="40" r="34" fill="#30d158" filter="url(#g)" opacity=".55"/><circle cx="0" cy="40" r="26" fill="#30d158"/><rect x="-16" y="100" width="32" height="56" rx="8" fill="#2c2c2e" stroke="#30d158" stroke-width="3"/><rect x="-9" y="126" width="18" height="22" rx="4" fill="#f5f5f7"/></g>
    <g transform="translate(440 0)"><circle cx="0" cy="40" r="26" fill="#1c3d5c"/><rect x="-16" y="100" width="32" height="56" rx="8" fill="#2c2c2e" stroke="#0a84ff" stroke-width="3" stroke-dasharray="6 5"/><rect x="-9" y="126" width="18" height="22" rx="4" fill="#636366"/><text x="0" y="186" fill="#8e8e93" font-size="18" text-anchor="middle">cap removed</text></g>
    <g transform="translate(660 0)"><circle cx="0" cy="40" r="34" fill="#ffd60a" filter="url(#g)" opacity=".55"/><circle cx="0" cy="40" r="26" fill="#ffd60a"/><rect x="-16" y="100" width="32" height="56" rx="8" fill="#2c2c2e" stroke="#ffd60a" stroke-width="3"/><rect x="-9" y="108" width="18" height="22" rx="4" fill="#f5f5f7"/></g>
  </g>

  <g fill="none" stroke="#8e8e93" stroke-width="3" marker-end="url(#a)">
    <path d="M800 405 L800 470"/>
    <path d="M690 380 C600 380 470 380 380 380"/>
    <path d="M800 560 C800 610 300 600 300 680"/>
    <path d="M800 560 C800 620 640 620 640 680"/>
    <path d="M800 560 C800 620 960 620 960 680"/>
    <path d="M800 560 C800 610 1300 600 1300 680"/>
    <path d="M1030 760 C1080 840 1150 860 1200 870"/>
    <path d="M1235 900 C1100 940 990 900 990 800" stroke-dasharray="7 6"/>
