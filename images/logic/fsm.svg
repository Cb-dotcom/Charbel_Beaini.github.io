  <path d="M300 770 C300 860 140 860 140 560 C140 520 600 515 690 515" fill="none" stroke="#5a5a5e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>

  <g font-weight="600" text-anchor="middle">
    <rect x="690" y="345" width="220" height="64" rx="32" fill="#2c2c2e" stroke="#636366" stroke-width="2"/><text x="800" y="386" fill="#f5f5f7" font-size="26">Boot</text>
    <rect x="160" y="345" width="220" height="64" rx="32" fill="#2c2c2e" stroke="#636366" stroke-width="2"/><text x="270" y="386" fill="#f5f5f7" font-size="26">Locked</text>
    <text x="270" y="335" fill="#8e8e93" font-size="18" font-weight="500">SW2 on at boot · 1→1, 2→2</text>
    <rect x="640" y="470" width="320" height="90" rx="20" fill="#3a2a2e" stroke="#d58693" stroke-width="2.5"/><text x="800" y="512" fill="#f5f5f7" font-size="26">Sequence detector</text><text x="800" y="542" fill="#d58693" font-size="18" font-weight="500">last switch turned off</text>
    <rect x="200" y="680" width="200" height="90" rx="18" fill="#2c2c2e" stroke="#ff453a" stroke-width="2.5"/><text x="300" y="720" fill="#f5f5f7" font-size="24">Sequence 1</text><text x="300" y="750" fill="#a1a1a6" font-size="18" font-weight="500">1 → 2 → 3 → 4</text>
    <rect x="540" y="680" width="200" height="90" rx="18" fill="#2c2c2e" stroke="#30d158" stroke-width="2.5"/><text x="640" y="720" fill="#f5f5f7" font-size="24">Sequence 2</text><text x="640" y="750" fill="#a1a1a6" font-size="18" font-weight="500">2 → 3 → 4 → 1</text>
    <rect x="860" y="680" width="200" height="90" rx="18" fill="#2c2c2e" stroke="#0a84ff" stroke-width="2.5"/><text x="960" y="720" fill="#f5f5f7" font-size="24">Sequence 3</text><text x="960" y="750" fill="#a1a1a6" font-size="18" font-weight="500">3 → 4 → 1 → 2</text>
    <rect x="1200" y="680" width="200" height="90" rx="18" fill="#2c2c2e" stroke="#ffd60a" stroke-width="2.5"/><text x="1300" y="720" fill="#f5f5f7" font-size="24">Sequence 4</text><text x="1300" y="750" fill="#a1a1a6" font-size="18" font-weight="500">4 → 3 → 2 → 1</text>
    <rect x="1200" y="840" width="260" height="76" rx="18" fill="#1d1d1f" stroke="#0a84ff" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1330" y="874" fill="#f5f5f7" font-size="22">Switch not working</text><text x="1330" y="900" fill="#a1a1a6" font-size="17" font-weight="500">capless trick · 4 s timer</text>
  </g>
  <text x="140" y="900" fill="#6e6e73" font-size="18" font-weight="500">all switches off + 4 s → back to the detector</text>
  <text x="1560" y="975" fill="#48484a" font-size="16" text-anchor="end">Logic-Controlled Board · FSM</text>
